<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet" />
        <link rel="stylesheet" href="./css/ecommerce.css" />
        <title>Shop</title>
    </head>
    <body>
        <header>
            <nav>
                <div class="container">
                    <div class="nav-items">
                        <div class="nav-item">
                            <a href="./index.html" class="nav-link"><span>Home</span></a>
                        </div>
                        <div class="nav-item">
                            <a href="./aboutme.html" class="nav-link"><span>About me</span></a>
                        </div>
                        <div class="nav-item">
                            <a href="#" class="nav-link"><span>Form</span></a>
                        </div>
                    </div>
                </div>
            </nav>
        </header>
        <main>
            <div class="container">
                <h1>Customize your shirt with us!</h1>
            </div>
            <section>
                <div class="container">
                    <div class="products">
                        <div class="title">Select type of your shirt below:</div>
                        <div class="cards">
                            <div class="card">
                                <input type="radio" name="product" id="product1" />
                                <label for="product1">
                                    <div class="product-img">
                                        <img src="./images/tshirt.png" alt="T-Shirt" />
                                    </div>
                                    <div class="product-name">T-shirt</div>
                                </label>
                            </div>
                            <div class="card">
                                <input type="radio" name="product" id="product2" />
                                <label for="product2">
                                    <div class="product-img">
                                        <img src="./images/poloshirt.png" alt="Polo shirt" />
                                    </div>
                                    <div class="product-name">Polo</div>
                                </label>
                            </div>
                            <div class="card">
                                <input type="radio" name="product" id="product3" />
                                <label for="product3">
                                    <div class="product-img">
                                        <img src="./images/buttonup.webp" alt="Button up" />
                                    </div>
                                    <div class="product-name">Button Up</div>
                                </label>
                            </div>
                            <div class="card">
                                <input type="radio" name="product" id="product4" />
                                <label for="product4">
                                    <div class="product-img">
                                        <img src="./images/hoodie.webp" alt="Hoodie" />
                                    </div>
                                    <div class="product-name">Hoodie</div>
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="designs">
                        <div class="title">Select design:</div>
                        <div class="cards">
                            <div class="card">
                                <input type="radio" name="design" id="design1">
                                <label for="design1">
                                    <div class="design-img">
                                        <img src="./images/pattern1.avif" alt="Design 1">
                                    </div>
                                    <div class="design-name">Design 1</div>
                                </label>
                            </div>
                            <div class="card">
                                <input type="radio" name="design" id="design2">
                                <label for="design2">
                                    <div class="design-img">
                                        <img src="./images/pattern2.jpg" alt="Design 2">
                                    </div>
                                    <div class="design-name">Design 2</div>
                                </label>
                            </div>
                            <div class="card">
                                <input type="radio" name="design" id="design3">
                                <label for="design3">
                                    <div class="design-img">
                                        <img src="./images/pattern3.avif" alt="Design 3">
                                    </div>
                                    <div class="design-name">Design 3</div>
                                </label>
                            </div>
                            <div class="card">
                                <input type="radio" name="design" id="design4">
                                <label for="design4">
                                    <div class="design-img">
                                        <img src="./images/pattern4.avif" alt="Design 4">
                                    </div>
                                    <div class="design-name">Design 4</div>
                                </label>
                            </div>
                            <div class="card">
                                <input type="radio" name="design" id="design5">
                                <label for="design5">
                                    <div class="design-img">
                                        <img src="./images/pattern5.jpg" alt="Design 5">
                                    </div>
                                    <div class="design-name">Design 2</div>
                                </label>
                            </div>
                            <div class="card">
                                <input type="radio" name="design" id="design6">
                                <label for="design6">
                                    <div class="design-img">
                                        <img src="./images/pattern2.jpg" alt="Design 6">
                                    </div>
                                    <div class="design-name">Design 2</div>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <footer>
            <div class="container">
                <div class="total">TOTAL: 53.00 RM</div>
            </div>
        </footer>
    </body>
</html>
